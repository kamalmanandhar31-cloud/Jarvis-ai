
<!DOCTYPE html>
<html>
<head>
  <title>JARVIS AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #07111f;
      color: #00eaff;
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }
    h1 {
      margin-top: 60px;
      font-size: 38px;
    }
    button {
      background: #00cfff;
      color: black;
      border: none;
      padding: 18px 35px;
      border-radius: 30px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>J.A.R.V.I.S</h1>
  <p>Personal AI Assistant</p>
  <p id="status">System Ready</p>
  <button onclick="listen()">🎤 TALK TO JARVIS</button>
<button onclick="speak('Hello Sir! JARVIS systems are online.')">
Activate JARVIS
</button>

  <script>

function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-GB";
  speech.rate = 0.88;
  speech.pitch = 0.65;
  speech.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("status").innerText =
      "Please use Chrome.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("status").innerText =
      "Listening...";
  };

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    const command = text.toLowerCase();
    let answer = "";

    if (command.includes("hello")) {
      answer = "Hello Sir! How can I help you?";
    }
    else if (command.includes("your name")) {
      answer = "I am JARVIS, your personal assistant.";
    }
    else if (command.includes("time")) {
      answer = "The time is " +
        new Date().toLocaleTimeString("en-US");
    }
    else if (command.includes("date")) {
      answer = "Today's date is " +
        new Date().toLocaleDateString("en-US");
    }
    else if (command.includes("who created you")) {
      answer = "You created me, Sir!";
    }
    else if (command.includes("open youtube")) {
      answer = "Opening YouTube.";
      window.open("https://www.youtube.com", "_blank");
    }
    else {
      answer = "Sorry Sir, I don't understand that command yet.";
    }

    document.getElementById("status").innerText =
      "You said: " + text;

    speak(answer);
  };

  recognition.onerror = function(event) {
    document.getElementById("status").innerText =
      "Error: " + event.error;
  };

  recognition.onend = function() {
    console.log("Listening stopped");
  };

  recognition.start();
}

      </script>
</body>
</html>
